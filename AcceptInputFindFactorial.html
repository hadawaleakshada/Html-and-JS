<html>

<head>

    <title>Find the factorial of a number</title>
    <script>
        function calculateFactorial() {
            let num = document.getElementById("number").value;

            if (num < 0) {
                // console.log("factorial cannot define for negative numbers.");
                document.getElementById("result").innerText = "the factorial cannot define for negative numbers";
            }
            else {



                let fact = 1;
                for (let i = 1; i <= num; i++) {

                    fact *= i;
                }

                document.getElementById("result").innerText = "the factorial is:" + fact;
            }
        }



    </script>
</head>

<body>
    <label>Enter the any number you want:</label>
    <input type="text" id="number" />
    <button onclick="calculateFactorial()">check the factorial</button>
    <div id="result"></div>

</body>

</html>
