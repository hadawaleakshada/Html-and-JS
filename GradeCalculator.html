<html>
<head>
    <title>Gradecalculator</title>
    <script>
        function submit(){
            let marks=document.getElementById("grade").value;
            // console.log('grade:', grade);
            // document.getElementById("result").innerText=grade;
            if(marks>=90 && marks<=100)
        {
            // console.log("Grade A");
            document.getElementById("result").innerText="Grade A";
        }
            else if(marks>=80 && marks<90)
        {
            // console.log("Grade B");
            document.getElementById("result").innerText="Grade B";
        }
            else if (marks>=70 && marks<80) 
        {
            // console.log("Grade c");
            document.getElementById("result").innerText="Grade C";
        }
            else if(marks>=60 && marks<70)
        {
            // console.log("Grade D");
            document.getElementById("result").innerText="Grade D";
        }
            else if(marks>=0 && marks<60)
            {
                // console.log("fail")
                document.getElementById("result").innerText="fail";
            }
            else if(marks<0)
            {
                // console.log("your input is invalid")
                document.getElementById("result").innerText="your input is invalid";
            }
            else{
                // console.log("invalid")
                document.getElementById("result").innerText="Invalid";
            }
                
            
        
           
    }
        </script>
</head>
<body>
    <label>Grade Calculator</label>
    <input type="text" id="grade"/>
    <button onclick="submit()">Check Your Grade</button>
    <div id="result"></div>

    
</body>
</html>
